[package]
name = "mail-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
description = "The Mail backend: HTTP API, IMAP and SMTP servers, on PostgreSQL"
license = "ISC"
publish = false

[[bin]]
name = "mail-server"
path = "src/main.rs"

[lib]
name = "mail_server"
path = "src/lib.rs"

[dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures-util = "0.3"
bytes = "1"

# HTTP server and client
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
url = "2"
idna = "1"
flate2 = "1"

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
postgres-types = "0.2"
postgres-protocol = "0.6"
deadpool-postgres = "0.14"
fallible-iterator = "0.2"

# Errors
anyhow = "1"
thiserror = "2"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
fancy-regex = "0.14"
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"
# `String.prototype.localeCompare`: the order mailboxes are listed in
icu_collator = "2"
# errno names and the host name for the SMTP listeners
libc = "0.2"

# Crypto
bcrypt = "0.17"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
ed25519-dalek = "2"
rsa = { version = "0.9", features = ["sha2"] }
hkdf = "0.12"
aes-gcm = "0.10"

# TLS for the mail listeners: the system OpenSSL, which takes the legacy
# TLS 1.2 handshakes Bun's BoringSSL takes and rustls refuses (`tls.rs`).
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"
tokio-openssl = "0.6"
# The loopback probe of `/api/health`, and the tests' TLS client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# DNS (DNSBL lookups)
hickory-resolver = "0.24"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
# Enough for readable backtraces; full debug info multiplies the build size.
debug = "line-tables-only"

[profile.dev]
# The dependencies do the heavy lifting (bcrypt, TLS, regex); optimizing them
# keeps a debug build of the server fast enough to run the black-box suite.
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
